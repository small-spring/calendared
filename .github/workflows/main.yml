# Calendared: rewritten (upstream used release-please on `main` with a personal token).
# Push a tag that matches manifest.json's version (e.g. `git tag 0.1.0 && git push origin 0.1.0`, no leading `v`).
# This tests and builds the plugin and makes a draft release with main.js, manifest.json and styles.css;
# check the draft on GitHub, write the notes and publish it.
name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check the tag matches manifest.json
        run: |
          version="$(node -p "require('./manifest.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest.json's version $version" >&2
            exit 1
          fi
      - name: Test and build
        run: |
          npm ci
          npm test
          npm run build
          node scripts/check-load.cjs main.js
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --draft --title "$GITHUB_REF_NAME" --notes "Calendared $GITHUB_REF_NAME"
